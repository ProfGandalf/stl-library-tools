# Builds the app from app/ as ONE downloadable file:
#   STL-Tools.exe  (Windows, with the app icon)
#   STL-Tools-linux.tar.gz  (Linux: STL-Tools/ folder with the program and its
#                            icon; the archive keeps the executable permission)
#   STL-Tools-linux  (Linux, bare file, kept so old links keep working)
# The "app-latest" release (Releases) is updated only from the main branch -
# on other branches the files stay as artifacts of the Actions run.
# render_grid.py is bundled inside - nothing else needs to be downloaded.
name: Build app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            icon: --icon app/icon/icon.ico
          - os: ubuntu-22.04
            name: linux
            icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax
        run: python -m py_compile app/stl_tools.py app/render_grid.py
      - name: PyInstaller
        shell: bash     # the default on Windows is PowerShell, which breaks "\" line continuations
        run: |
          python -m pip install --upgrade pip pyinstaller==6.11.1
          pyinstaller --onefile --windowed --name STL-Tools ${{ matrix.icon }} \
            --add-data "app/render_grid.py:." --add-data "app/icon:icon" app/stl_tools.py
      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/STL-Tools
          cp dist/STL-Tools pkg/STL-Tools/STL-Tools
          cp app/icon/icon.png pkg/STL-Tools/icon.png
          printf '%s\n' \
            "STL Library Tools" \
            "" \
            "Double-click STL-Tools to start it. On start it adds itself to the" \
            "applications menu (with its icon). If you move this folder, start" \
            "STL-Tools once from the new place and the menu entry follows it." \
            "Needs Blender: https://www.blender.org/download/" > pkg/STL-Tools/README.txt
          tar -C pkg -czf dist/STL-Tools-linux.tar.gz STL-Tools
          mv dist/STL-Tools dist/STL-Tools-linux
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # two quick merges must not replace the files at the same time
    concurrency:
      group: release-app-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release app-latest
        # The release is NOT deleted and recreated - that made the
        # releases/latest/download/... links return 404 for a while. Files are
        # replaced in place: the new file is uploaded under a temporary name,
        # the old one deleted, the new one renamed (the gap is a fraction of a
        # second instead of the whole upload).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=app-latest
          FILES="STL-Tools.exe STL-Tools-linux.tar.gz STL-Tools-linux"
          NOTES="Built from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Windows: download STL-Tools.exe and run it. Linux: download STL-Tools-linux.tar.gz, extract it and double-click STL-Tools (it adds itself to the applications menu). Python is not needed, Blender is."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" $(for f in $FILES; do echo "out/$f"; done) \
              --target "$GITHUB_SHA" --latest \
              --title "STL Tools (latest version)" --notes "$NOTES"
            exit 0
          fi

          for f in $FILES; do
            cp "out/$f" "out/new-$f"
            gh release upload "$TAG" "out/new-$f" --clobber
            old=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$f\") | .id")
            new=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"new-$f\") | .id")
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$old"
            fi
            gh api -X PATCH "repos/$GH_REPO/releases/assets/$new" -f name="$f" >/dev/null
          done

          # the tag points at the commit the files were built from (cosmetic -
          # if GitHub refuses, the files are already replaced anyway)
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || echo "::warning::Could not move tag $TAG to $GITHUB_SHA"
          gh release edit "$TAG" --latest --title "STL Tools (latest version)" --notes "$NOTES"
